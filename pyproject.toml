[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dom"
version = "0.1.0"
description = "Дом Шинобу — личный архив: арты, каталог, дневник, рассказы и голосовые заметки"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "ruff>=0.6"]

[project.scripts]
dom = "dom.__main__:main"

[tool.setuptools]
packages = ["dom"]

[tool.setuptools.package-data]
dom = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
